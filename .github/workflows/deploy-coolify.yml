name: deploy-coolify

on:
  workflow_call:
    inputs:
      coolify-url:
        description: Base URL of the Coolify instance (e.g. https://coolify.example.com)
        type: string
        required: true
      app-uuid:
        description: UUID of the Coolify application to deploy
        type: string
        required: true
      wait:
        description: Follow the deployment until it ends and verify the deployed commit
        type: boolean
        default: true
      environment:
        description: GitHub environment the deploy job runs in (deployment history, protection rules)
        type: string
        default: production
      healthcheck-url:
        description: URL fetched after a verified deployment until it answers 200 (empty skips the check)
        type: string
        default: ""
      healthcheck-expect:
        description: Text the healthcheck body must contain, e.g. the commit SHA when the app exposes it
        type: string
        default: ""
      healthcheck-timeout:
        description: Seconds to wait for the healthcheck to pass
        type: number
        default: 120
    secrets:
      coolify-token:
        description: Coolify API token with read + deploy permissions only
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Coolify is followed for up to 15 min, the healthcheck for up to healthcheck-timeout (≤ 900 s).
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Validate inputs
        id: validate
        env:
          HEALTHCHECK_URL: ${{ inputs.healthcheck-url }}
          HEALTHCHECK_TIMEOUT: ${{ inputs.healthcheck-timeout }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [ -n "$HEALTHCHECK_URL" ] && ! [[ $HEALTHCHECK_URL =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::Input 'healthcheck-url' must be an http(s) URL without spaces, got: $(printf '%q' "$HEALTHCHECK_URL")"
            exit 1
          fi
          if ! [[ $HEALTHCHECK_TIMEOUT =~ ^[0-9]+$ ]] || [ "$HEALTHCHECK_TIMEOUT" -lt 1 ] || [ "$HEALTHCHECK_TIMEOUT" -gt 900 ]; then
            echo "::error::Input 'healthcheck-timeout' must be a whole number of seconds between 1 and 900, got: $(printf '%q' "$HEALTHCHECK_TIMEOUT")"
            exit 1
          fi

      - name: Deploy to Coolify
        id: deploy
        env:
          COOLIFY_URL: ${{ inputs.coolify-url }}
          APP_UUID: ${{ inputs.app-uuid }}
          WAIT: ${{ inputs.wait }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck-url }}
          HEALTHCHECK_EXPECT: ${{ inputs.healthcheck-expect }}
          HEALTHCHECK_TIMEOUT: ${{ inputs.healthcheck-timeout }}
          COOLIFY_TOKEN: ${{ secrets.coolify-token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${COOLIFY_URL%/}/api/v1"
          interval="${POLL_INTERVAL:-20}"
          timeout="${POLL_TIMEOUT:-900}"
          health_interval="${HEALTH_INTERVAL:-5}"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          curl_opts=(--connect-timeout 10 --max-time "${CURL_MAX_TIME:-30}")
          uuid=""
          start=""

          fail() {
            local msg="$*"
            if [ -n "$uuid" ]; then
              msg="${msg} (deployment ${uuid}${start:+, $(( SECONDS - start ))s})"
            fi
            echo "::error::${msg}"
            echo "❌ ${msg}" >> "$summary"
            exit 1
          }
          # Non-JSON bodies (an HTML error page) are quoted on one line, printable characters only.
          snippet() {
            printf '%s' "$1" | tr -cd '[:print:]' | head -c 200
          }
          # request <curl args...>: sets `code` and `body`; returns curl's own status.
          request() {
            local r
            r=$(curl -sS "${curl_opts[@]}" -w '\n%{http_code}' "$@") || { code=000; body=""; return 1; }
            code=${r##*$'\n'}
            body=${r%$'\n'*}
          }

          # 1. Freshness: skip if the branch moved past the tested commit.
          head=$(curl -sS --fail "${curl_opts[@]}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])') \
            || fail "Could not read the current head of ${GITHUB_REF_NAME}"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_REF_NAME} moved to ${head:0:7} after the tested commit ${GITHUB_SHA:0:7}; skipping, the newer run deploys."
            echo "⏭️ Skipped: ${GITHUB_REF_NAME} moved to \`${head:0:7}\`, its own run deploys it." >> "$summary"
            exit 0
          fi

          # 2. Trigger.
          request -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" "${api}/deploy?uuid=${APP_UUID}&force=false" \
            || fail "Coolify unreachable at ${COOLIFY_URL}"
          case "$code" in
            200) ;;
            401) fail "Coolify rejected the token (401): invalid token or API access disabled" ;;
            403) fail "The Coolify token lacks the deploy permission (403)" ;;
            404) fail "Coolify application ${APP_UUID} not found (404)" ;;
            429) fail "The Coolify deployment queue is full (429); retry once queued deployments finish" ;;
            *) fail "Coolify deploy request failed (HTTP ${code}): $(snippet "$body")" ;;
          esac
          uuid=$(printf '%s' "$body" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])' 2>/dev/null) \
            || uuid=""
          [ -n "$uuid" ] || fail "No deployment_uuid in Coolify response: $(snippet "$body")"
          message=$(printf '%s' "$body" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0].get("message", ""))' 2>/dev/null) \
            || message=""
          # Coolify answers 200 with a fresh, untracked uuid when the app already has a
          # deployment of commit HEAD queued or running (manual Redeploy, earlier run).
          if [[ "$message" == *"already queued"* ]]; then
            fail "Coolify already has a deployment queued or in progress for ${APP_UUID}; it was not re-triggered and cannot be verified from here. Check it in Coolify, then re-run this job."
          fi
          echo "Deployment ${uuid} queued for ${GITHUB_SHA:0:7}"
          echo "🚀 Deployment \`${uuid}\` queued for \`${GITHUB_SHA:0:7}\`" >> "$summary"
          if [ "$WAIT" != "true" ]; then
            echo "wait=false: not following the deployment"
            exit 0
          fi

          # 3. Follow until a terminal status. `commit` reads "HEAD" until then.
          start=$SECONDS
          status=""
          commit=""
          while :; do
            if (( SECONDS - start > timeout )); then
              fail "Timed out after ${timeout}s waiting for deployment ${uuid} (last status: ${status:-none}); it may still complete in Coolify"
            fi
            if ! request -H "Authorization: Bearer ${COOLIFY_TOKEN}" "${api}/deployments/${uuid}"; then
              echo "::warning::Coolify did not answer while following ${uuid}; retrying"
              sleep "$interval"
              continue
            fi
            if [ "$code" != 200 ]; then
              detail=$(printf '%s' "$body" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("message", ""))' 2>/dev/null) \
                || detail=""
              [ "$code" = 403 ] && fail "The Coolify token lacks the read permission (403): ${detail:-no detail}"
              fail "Following deployment ${uuid} failed (HTTP ${code})${detail:+: ${detail}}"
            fi
            read -r status commit < <(printf '%s' "$body" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["status"], d.get("commit") or "-")' 2>/dev/null) \
              || fail "Unreadable deployment status: $(snippet "$body")"
            echo "$(( SECONDS - start ))s: ${status}"
            case "$status" in
              finished | failed | cancelled-by-user) break ;;
            esac
            sleep "$interval"
          done

          # 4. Verify outcome and commit.
          [ "$status" = finished ] || fail "Coolify deployment ${uuid} ended with status '${status}'"
          [ "$commit" = "$GITHUB_SHA" ] || fail "Coolify deployed ${commit} instead of the tested commit ${GITHUB_SHA}"

          # 5. Optional healthcheck: Coolify's `finished` says the container started, not that it serves.
          if [ -n "$HEALTHCHECK_URL" ]; then
            health_start=$SECONDS
            while :; do
              request "$HEALTHCHECK_URL" 2>/dev/null || true
              if [ "$code" != 200 ]; then
                last="HTTP ${code}"
              elif [ -n "$HEALTHCHECK_EXPECT" ] && [[ $body != *"$HEALTHCHECK_EXPECT"* ]]; then
                last="HTTP 200, body without '${HEALTHCHECK_EXPECT}'"
              else
                echo "Healthcheck passed: ${HEALTHCHECK_URL} (HTTP 200${HEALTHCHECK_EXPECT:+, body contains the expected text})"
                echo "✅ Healthcheck passed: \`${HEALTHCHECK_URL}\`" >> "$summary"
                break
              fi
              if (( SECONDS - health_start >= HEALTHCHECK_TIMEOUT )); then
                fail "Healthcheck ${HEALTHCHECK_URL} did not pass within ${HEALTHCHECK_TIMEOUT}s (last: ${last})"
              fi
              echo "$(( SECONDS - health_start ))s: healthcheck ${last}, retrying"
              sleep "$health_interval"
            done
          fi

          echo "Deployed ${GITHUB_SHA:0:7} in $(( SECONDS - start ))s"
          echo "✅ Deployed \`${GITHUB_SHA:0:7}\` (deployment \`${uuid}\`, $(( SECONDS - start ))s)" >> "$summary"
