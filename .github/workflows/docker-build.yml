name: docker-build

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context, relative to the repository root
        type: string
        default: .
      dockerfile:
        description: Dockerfile path, relative to the build context
        type: string
        default: Dockerfile
      build-args:
        description: Build arguments, one KEY=VALUE per line; public values only, secrets never belong here
        type: string
        default: ""
      target:
        description: Dockerfile stage to build (--target); empty builds the last stage
        type: string
        default: ""
      smoke:
        description: Command run after the build with IMAGE set to the locally loaded image; it must exit non-zero on failure
        type: string
        default: ""
      push:
        description: Push the image to GHCR once the build (and the smoke test) passed; the calling job needs packages write
        type: boolean
        default: false
      image:
        description: Image to push, on ghcr.io only; defaults to ghcr.io/<owner>/<repository> lower-cased
        type: string
        default: ""

# No workflow-level permissions: the calling job's apply. `contents: read` is enough to build;
# `push: true` also needs `packages: write`, which a called workflow cannot grant itself.

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docker-build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.context }}-${{ inputs.dockerfile }}-${{ inputs.target }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Neither the build context nor the smoke command needs git credentials.
          persist-credentials: false

      - name: Validate inputs
        id: validate
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ inputs.build-args }}
          IMAGE: ${{ inputs.image }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          dir_re='^[A-Za-z0-9._][A-Za-z0-9._/-]*$'
          require_relative_path() { # <input name> <value>
            if ! [[ $2 =~ $dir_re ]] || [[ /$2/ == */../* ]]; then
              echo "::error::Input '$1' must be a relative path inside the repository, got: $(printf '%q' "$2")"
              exit 1
            fi
          }
          require_relative_path context "$CONTEXT"
          require_relative_path dockerfile "$DOCKERFILE"
          if ! [[ $TARGET =~ ^[A-Za-z0-9_.-]*$ ]]; then
            echo "::error::Input 'target' must be a Dockerfile stage name, got: $(printf '%q' "$TARGET")"
            exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if ! [[ $line =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::Input 'build-args' must be KEY=VALUE lines, got: $(printf '%q' "$line")"
              exit 1
            fi
          done <<< "$BUILD_ARGS"
          image=""
          if [ "$PUSH" = true ]; then
            image=${IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}}
            # Docker's path-component grammar: separators are one dot, one or two underscores, or dashes.
            component='[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*'
            image_re="^ghcr\.io/${component}(/${component})+$"
            if ! [[ $image =~ $image_re ]]; then
              echo "::error::Input 'image' must be a lower-case ghcr.io/<owner>/<name> reference (push logs in with GITHUB_TOKEN), got: $(printf '%q' "$image")"
              exit 1
            fi
          fi
          # One cache scope per context/Dockerfile/target: two docker-build jobs of one repository
          # sharing the default scope overwrite each other's cache (mode=max).
          scope="${CONTEXT%/}-${DOCKERFILE}-${TARGET}"
          scope=${scope//[^A-Za-z0-9_.-]/-}
          {
            echo "scope=$scope"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "Cache scope: $scope"

      - name: Resolve Dockerfile
        id: resolve
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          file="${CONTEXT%/}/${DOCKERFILE}"
          if [ ! -f "$file" ]; then
            echo "::error::Dockerfile not found: ${file}"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        if: inputs.push
        env:
          IMAGE: ${{ steps.validate.outputs.image }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          tags=("${IMAGE}:sha-${GITHUB_SHA:0:7}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=("${IMAGE}:${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}")
          elif [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            tags+=("${IMAGE}:latest")
          fi
          {
            echo "tags<<MYCI_TAGS"
            printf '%s\n' "${tags[@]}"
            echo "MYCI_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags[*]}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.resolve.outputs.file }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          push: false
          load: ${{ inputs.smoke != '' }}
          tags: myci/smoke:local
          cache-from: type=gha,scope=${{ steps.validate.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.validate.outputs.scope }}

      - name: Smoke test
        id: smoke
        if: inputs.smoke != ''
        env:
          SMOKE: ${{ inputs.smoke }}
          IMAGE: myci/smoke:local
        run: bash -euo pipefail -c "$SMOKE"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        if: inputs.push
        # The same build on the same builder: its local layer cache (and the gha cache exported
        # above) serves every step, so the pushed layers are the ones the smoke test ran against.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.resolve.outputs.file }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ steps.validate.outputs.scope }}
