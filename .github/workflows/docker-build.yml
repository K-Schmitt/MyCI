name: docker-build

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context, relative to the repository root
        type: string
        default: .
      dockerfile:
        description: Dockerfile path, relative to the build context
        type: string
        default: Dockerfile

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Dockerfile
        id: resolve
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          file="${CONTEXT%/}/${DOCKERFILE}"
          if [ ! -f "$file" ]; then
            echo "::error::Dockerfile not found: ${file}"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.resolve.outputs.file }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
