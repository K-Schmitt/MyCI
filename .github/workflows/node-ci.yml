name: node-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version, ignored when .nvmrc exists
        type: string
        default: "24"
      require:
        description: Comma-separated package.json scripts that must exist
        type: string
        default: lint,build
      scripts:
        description: Comma-separated package.json scripts to run, in order; a script that does not exist is reported as absent
        type: string
        default: lint,typecheck,test,build
      env:
        description: Environment for the scripts, one KEY=VALUE per line; public values only (VITE_*, NEXT_PUBLIC_*), never a secret
        type: string
        default: ""
      audit:
        description: Fail on production dependencies with a known vulnerability of at least this severity (none, low, moderate, high, critical)
        type: string
        default: none
      pnpm-version:
        description: pnpm version, used only when package.json has no packageManager field
        type: string
        default: ""
      working-directory:
        description: Directory containing package.json, relative to the repository root
        type: string
        default: .

permissions:
  contents: read

jobs:
  node-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: node-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs
        id: validate
        working-directory: .
        env:
          WORKDIR: ${{ inputs.working-directory }}
          SCRIPTS: ${{ inputs.scripts }}
          REQUIRE: ${{ inputs.require }}
          AUDIT: ${{ inputs.audit }}
          BUILD_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          dir_re='^[A-Za-z0-9._][A-Za-z0-9._/-]*$'
          if ! [[ $WORKDIR =~ $dir_re ]] || [[ /$WORKDIR/ == */../* ]]; then
            echo "::error::Input 'working-directory' must be a relative path inside the repository, got: $(printf '%q' "$WORKDIR")"
            exit 1
          fi
          # A comma-separated script list, trimmed, without empties and duplicates, names checked.
          script_list() { # <input name> <value>: prints the names space-separated
            local name seen=" " kept=()
            IFS=',' read -ra raw <<< "$2"
            for name in "${raw[@]}"; do
              name=${name#"${name%%[![:space:]]*}"}
              name=${name%"${name##*[![:space:]]}"}
              [ -n "$name" ] || continue
              if ! [[ $name =~ ^[A-Za-z0-9_:.-]+$ ]]; then
                echo "::error::Input '$1' must be comma-separated package.json script names, got: $(printf '%q' "$name")" >&2
                return 1
              fi
              case "$seen" in *" ${name} "*) continue ;; esac
              seen="${seen}${name} "
              kept+=("$name")
            done
            echo "${kept[*]:-}"
          }
          names=$(script_list scripts "$SCRIPTS")
          require=$(script_list require "$REQUIRE")
          case "$AUDIT" in
            none | low | moderate | high | critical) ;;
            *)
              echo "::error::Input 'audit' must be one of none, low, moderate, high, critical, got: $(printf '%q' "$AUDIT")"
              exit 1 ;;
          esac
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if ! [[ $line =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::Input 'env' must be KEY=VALUE lines, got: $(printf '%q' "$line")"
              exit 1
            fi
          done <<< "$BUILD_ENV"
          {
            echo "names=${names}"
            echo "require=${require}"
          } >> "$GITHUB_OUTPUT"
          echo "Scripts: ${names:-none} (required: ${require:-none})"

      - name: Detect package manager
        id: detect
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            pm=pnpm
            lockfile=pnpm-lock.yaml
          elif [ -f package-lock.json ]; then
            pm=npm
            lockfile=package-lock.json
          else
            echo "::error::No lockfile in '${WORKDIR}': commit package-lock.json or pnpm-lock.yaml"
            exit 1
          fi
          pnpm_version=""
          if [ "$pm" = pnpm ]; then
            if ! node -e 'process.exit(String(require("./package.json").packageManager || "").startsWith("pnpm@") ? 0 : 1)'; then
              if [ -z "$PNPM_VERSION" ]; then
                echo "::error::pnpm detected but package.json has no \"packageManager\": \"pnpm@x.y.z\" field and no pnpm-version input was given"
                exit 1
              fi
              pnpm_version="$PNPM_VERSION"
            fi
          fi
          nvmrc=""
          if [ -f .nvmrc ]; then nvmrc="${WORKDIR}/.nvmrc"; fi
          {
            echo "pm=$pm"
            echo "lockfile=${WORKDIR}/${lockfile}"
            echo "pnpm-version=$pnpm_version"
            echo "nvmrc=$nvmrc"
          } >> "$GITHUB_OUTPUT"
          echo "Detected $pm (lockfile ${lockfile})"

      - name: Set up pnpm
        if: steps.detect.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.detect.outputs.pnpm-version }}
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.detect.outputs.nvmrc == '' && inputs.node-version || '' }}
          node-version-file: ${{ steps.detect.outputs.nvmrc }}
          cache: ${{ steps.detect.outputs.pm }}
          cache-dependency-path: ${{ steps.detect.outputs.lockfile }}

      - name: Install dependencies
        env:
          PM: ${{ steps.detect.outputs.pm }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi

      - name: Audit production dependencies
        id: audit
        if: inputs.audit != 'none'
        env:
          PM: ${{ steps.detect.outputs.pm }}
          AUDIT: ${{ inputs.audit }}
        run: |
          set -euo pipefail
          if [ "$PM" = pnpm ]; then
            pnpm audit --prod --audit-level="$AUDIT"
          else
            npm audit --omit=dev --audit-level="$AUDIT"
          fi

      - name: Check required scripts
        id: require
        env:
          REQUIRE_NAMES: ${{ steps.validate.outputs.require }}
        run: |
          set -euo pipefail
          read -ra wanted <<< "$REQUIRE_NAMES"
          [ ${#wanted[@]} -gt 0 ] || exit 0
          present=$(node -e 'const s = require("./package.json").scripts || {}; console.log(process.argv.slice(1).filter(n => Object.hasOwn(s, n)).join(" "))' "${wanted[@]}")
          missing=()
          for script in "${wanted[@]}"; do
            case " ${present} " in *" ${script} "*) ;; *) missing+=("$script") ;; esac
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required package.json scripts missing: ${missing[*]} (require: '${REQUIRE_NAMES}')"
            exit 1
          fi

      - name: Run scripts
        id: scripts
        env:
          PM: ${{ steps.detect.outputs.pm }}
          NAMES: ${{ steps.validate.outputs.names }}
          BUILD_ENV: ${{ inputs.env }}
        run: |
          set -uo pipefail
          # The caller's variables exist for this step only: the install above ran without them.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            export "${line?}"
            echo "env: ${line%%=*}"
          done <<< "$BUILD_ENV"
          read -ra names <<< "$NAMES"
          present=""
          if [ ${#names[@]} -gt 0 ]; then
            present=$(node -e 'const s = require("./package.json").scripts || {}; console.log(process.argv.slice(1).filter(n => Object.hasOwn(s, n)).join(" "))' "${names[@]}")
          fi
          results=()
          failed=""
          for name in "${names[@]}"; do
            if [ -n "$failed" ]; then
              results+=("${name}=skipped")
              continue
            fi
            case " ${present} " in
              *" ${name} "*) ;;
              *)
                results+=("${name}=absent")
                echo "${name}: no such script in package.json, skipped"
                continue ;;
            esac
            echo "::group::${PM} run ${name}"
            if "$PM" run "$name"; then
              results+=("${name}=success")
            else
              results+=("${name}=failure")
              failed=$name
            fi
            echo "::endgroup::"
          done
          echo "results=${results[*]:-}" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::error::Script '${failed}' failed"
            exit 1
          fi

      - name: Summary
        id: summary
        if: always()
        env:
          PM: ${{ steps.detect.outputs.pm }}
          NAMES: ${{ steps.validate.outputs.names }}
          RESULTS: ${{ steps.scripts.outputs.results }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### node-ci"
            echo "Package manager: \`${PM:-not detected}\` · Node: \`$(node --version 2>/dev/null || echo none)\`"
            echo
            echo "| Script | Result |"
            echo "|---|---|"
          } >> "$summary"
          declare -A result=()
          for pair in $RESULTS; do
            result[${pair%%=*}]=${pair#*=}
          done
          for name in $NAMES; do
            case "${result[$name]:-}" in
              success) text="✅ passed" ;;
              failure) text="❌ failed" ;;
              absent) text="⚠️ absent" ;;
              *) text="⏭️ not run" ;;
            esac
            echo "| ${name} | ${text} |" >> "$summary"
            echo "${name}: ${text}"
          done
