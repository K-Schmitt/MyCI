name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (with shellcheck)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color -oneline .github/workflows/*.yml examples/*.yml
      - name: Script tests
        run: bash tests/run.sh

  npm:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-npm
      require: lint,typecheck,test,build

  pnpm:
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: fixtures/node-pnpm
      require: lint,test,build

  rust:
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-ok
      gate: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo deny check

  rust-matrix:
    # Every optional input at once: two OSes, an apt package on Linux, Node from a lockfile.
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: fixtures/rust-ok
      os: '["ubuntu-latest","windows-latest"]'
      apt-packages: tree
      node-working-directory: fixtures/node-npm
      gate: >-
        cargo fmt --check && cargo test --locked && cargo deny check && node --version &&
        if [ "$RUNNER_OS" = Linux ]; then tree --version; fi

  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: fixtures/python-ok

  docker:
    uses: ./.github/workflows/docker-build.yml
    with:
      context: fixtures/node-npm

  negative:
    # A fork's GITHUB_TOKEN cannot dispatch workflows.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch negative-fixture and assert each job failed for its reason
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh workflow run negative-fixture.yml --ref "$REF" -f nonce="$NONCE"

          id=""
          for _ in $(seq 30); do
            id=$(gh run list --workflow negative-fixture.yml --event workflow_dispatch --limit 20 \
              --json databaseId,displayTitle \
              -q ".[] | select(.displayTitle == \"negative ${NONCE}\") | .databaseId")
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "::error::negative-fixture run 'negative ${NONCE}' not found"; exit 1; }
          echo "negative-fixture run: $id"

          gh run watch "$id" --interval 10 > /dev/null || true
          gh run view "$id" --json jobs > jobs.json

          status=0
          # job prefix | step that must be the failing one. A caller job expands to several
          # "<caller> / <called>" jobs (rust-ci adds "validate" and matrix legs), so the failed one
          # is asserted; when none failed, the first one reports why.
          for pair in "broken|Test" "missing-script|Check required scripts" "nolock|Detect package manager" "rust-broken|Run gate" "rust-no-toolchain|Detect Rust project" "rust-no-lock|Detect Rust project" "rust-bad-os|Validate inputs" "rust-bad-apt|Validate inputs" "rust-node-no-lock|Detect Node project" "python-broken|Run gate" "python-no-requirements|Detect Python project"; do
            job=${pair%%|*}
            want=${pair#*|}
            got=$(jq -r --arg p "${job} /" \
              '[.jobs[] | select(.name | startswith($p))] | (map(select(.conclusion == "failure"))[0] // .[0]) | "\(.conclusion)|\([.steps[] | select(.conclusion == "failure") | .name][0])"' \
              jobs.json)
            if [ "$got" = "failure|${want}" ]; then
              echo "OK   ${job}: failed at '${want}'"
            else
              echo "::error::${job}: expected failure at '${want}', got '${got}'"
              status=1
            fi
          done
          exit "$status"
